# Plain HTTP: only serves ACME (Let's Encrypt) challenges and redirects
# everything else to HTTPS. Keep this even after certs exist — Certbot's
# renewals need this path reachable over port 80.
server {
    listen 80;
    listen [::]:80;
    server_name persepolisconstruction.co.uk www.persepolisconstruction.co.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name persepolisconstruction.co.uk www.persepolisconstruction.co.uk;

    ssl_certificate /etc/letsencrypt/live/persepolisconstruction.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/persepolisconstruction.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Matches the backend's own MAX_BODY_BYTES guard (app/main.py) — keep
    # these two in sync, otherwise nginx rejects large uploads with its own
    # generic 413 before the app's clearer error message ever gets a chance.
    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # Text assets compress well (often 70-80% smaller); images/fonts are
    # already-compressed formats where gzip does nothing (or slightly
    # inflates them), so they're deliberately left out.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # admin.html is already noindex'd via robots.txt/meta tag; this belt-and-
    # suspenders header keeps it out of caches/search indexes at the proxy too.
    # Matches both /admin and /admin.html since the location / block below
    # serves either form.
    location ~ ^/admin(\.html)?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /admin.html =404;
    }

    # ^~ on these two: without it, a request like /static/uploads/x.jpg would
    # also be a candidate for the image-caching regex location further down,
    # and regex locations take priority over a plain prefix match — ^~ forces
    # nginx to stop here instead, so uploads keep reaching the backend.
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded project photos, served by the backend from static/uploads.
    location ^~ /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # FastAPI's interactive docs — harmless to leave public, but drop this
    # location block if you'd rather keep API internals off the open web.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Images/icons/fonts change rarely — cache them for a month. CSS/JS get a
    # much shorter cache since this site has no build step / filename
    # fingerprinting to bust a cache on deploy, and it's still under active
    # edits; an hour caps how long a visitor could see stale styling/behavior
    # after a change without needing every deploy to also rename files.
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # $uri.html lets a clean URL like /services resolve to services.html
    # without a redirect — the address bar keeps showing /services.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}

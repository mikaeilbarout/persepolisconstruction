services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever DATABASE_URL is in .env — the db file must live
      # under the mounted volume below to survive `docker compose up --build`.
      DATABASE_URL: sqlite:////app/data/persepolis.db
    volumes:
      - backend_data:/app/data
      - ./backend/static/uploads:/app/static/uploads
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # Published as 8444 (not 443) per an Origin Rule configured on the
      # Cloudflare side to route to this port — nginx itself still listens
      # on 443 inside the container (right side of the mapping), so
      # nginx.conf doesn't need to change at all.
      - "8444:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      # Mount the directory, not the single file — a single-file bind mount
      # pins the file's inode at container start, and `git pull` replaces
      # files via rename (new inode), so the container would keep serving a
      # stale config after every pull no matter how many times you `reload`.
      # Directory mounts re-resolve the path on each access instead.
      - ./nginx:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  backend_data:
